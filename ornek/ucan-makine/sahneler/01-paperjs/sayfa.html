const kis = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

    const ust = (x) => x < 190 ? 757 - 69 * (x - 40) / 175 : x < 930 ? 792 : 766 - 16 * (x - 925) / 270;
    let ilk = true;
    for (let x = 90; x < 1170; x += 10) {
      const yk = omurgaY(x) - 11, l = Math.min(20 + 14 * hash(x, 77), (yk - ust(x) - 6) / 0.85);
      if (l < 7) continue;
      cizgi(R([[x - l * 0.5, yk - l * 0.85], [x, yk]]), { w: 0.9, alfa: 0.55, amp: 0.2, uc0: 4, uc1: 5, agirlik: 1.2, ses: ilk ? "hisirti" : false, tur: "tarama" }); ilk = false;
    }
    // halatlar
    cizgi(R([[455, 585], [600, 588], [737, 592]]), { w: 0.9, renk: SOLUK, alfa: 0.75, amp: 0.3 });
    cizgi(R([[748, 600], [960, 672], [1192, 742]]), { w: 0.9, renk: SOLUK, alfa: 0.75, amp: 0.3 });
    kenar.forEach((p) => p.remove());
  });
  // kanat ve kuyruk zarı: açık renk aguarel yıkama (yumuşak, flaş değil)
  const kokP = yol(R(G.kanatKok));
  let zar = ornekle(kokP, 60); kokP.remove();
  zar = zar.concat(...kavisler.map((k) => k.slice(1)));
  kanatYikama = new P.Path({ segments: zar.map(pt), closed: true, insert: false });
  kanatYikama.smooth({ type: "catmull-rom" });
  const kzar = [G.kuyrukGobek, ...kuyrukK[0].slice(1)].concat(...kuyrukKv.map((k) => k.slice(1)), kuyrukK[5].slice().reverse().slice(1));
  kuyrukYikama = new P.Path({ segments: kzar.map(pt), closed: true, insert: false });
  // H — ayna yazısı (sağdan sola, okunmaz satırlar)
  faz(173, 198, 1.05, () => {
    const satir = (xr, y, uz, sd) => {
      let x = xr, w = 0;

        const kel = 22 + 64 * hash(w, sd, 1), pts = [], per = 7.5 + 3 * hash(w, sd, 2), om = 2 * Math.PI / per, by = y + 2.5 * gurul(w * 0.7, sd);

          const yy = by + yuk * (0.5 - 0.5 * Math.cos(t * om));
          pts.push([x - t + 2.6 * Math.sin(t * om) - 0.32 * (by - yy), yy]);
        }
        cizgi(pts, { w: 1.3, renk: SOLUK, alfa: 0.9, amp: 0.15, aralik: 1.1, duz: true, uc0: 3, uc1: 4, agirlik: kel / 3, ses: w === 0 ? "hisirti" : false, tur: "yazi" });
        x -= kel + 10 + 9 * hash(w, sd, 5); w++;
      }
    };
    [[520, 132, 400], [520, 166, 420], [520, 200, 380], [520, 234, 410], [520, 268, 330], [520, 302, 210]].forEach(([xr, y, u], i) => satir(xr, y, u, 300 + i));
    [[1850, 150, 470], [1850, 184, 440], [1850, 218, 460], [1850, 252, 280]].forEach(([xr, y, u], i) => satir(xr, y, u, 400 + i));
  });
  // I — menteşeye kırmızı halka
  faz(199, 214, 1, () => { halka = cember(G.mentese, 50, { w: 3.4, renk: KIRMIZI, alfa: 0.95, tur_: 1.16, a0: -2.5, amp: 0.8, uc0: 8, uc1: 30, ses: "kirmizi" }); });
}

// ---------- kağıt dokusu (tohumlu, sabit) ----------
function kagitDoku() {
  const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
  g.fillStyle = KAGIT; g.fillRect(0, 0, W, H);
  for (const [gw, gh, al, sd] of [[48, 27, 0.065, 3], [160, 90, 0.04, 4]]) {
    const s = document.createElement("canvas"); s.width = gw; s.height = gh; const sg = s.getContext("2d"), id = sg.createImageData(gw, gh);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) { const v = hash(x, y, sd), i = (y * gw + x) * 4; id.data[i] = 120; id.data[i + 1] = 88; id.data[i + 2] = 48; id.data[i + 3] = 255 * al * v; }
    sg.putImageData(id, 0, 0); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; g.drawImage(s, 0, 0, W, H);
  }
  // lekeler (foxing)
  for (let i = 0; i < 9; i++) {
    const x = hash(i, 51) * W, y = hash(i, 52) * H, r = 30 + hash(i, 53) * 120;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(140,100,50,${0.05 + 0.05 * hash(i, 54)})`); gr.addColorStop(0.75, "rgba(140,100,50,0.03)"); gr.addColorStop(0.9, `rgba(120,80,40,${0.04 * hash(i, 55)})`); gr.addColorStop(1, "rgba(140,100,50,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  // lifler
  g.lineWidth = 0.7;
  for (let i = 0; i < 420; i++) { const x = hash(i, 61) * W, y = hash(i, 62) * H, a = hash(i, 63) * 6.28, l = 6 + hash(i, 64) * 22;
    g.strokeStyle = `rgba(110,80,45,${0.05 + 0.06 * hash(i, 65)})`; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.6) * l / 2, y + Math.sin(a + 0.6) * l / 2, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  // ince tane
  const id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0, p = 0; i < d.length; i += 4, p++) { const v = (hash(p, 71) - 0.5) * 9; d[i] += v; d[i + 1] += v; d[i + 2] += v * 0.9; }
  g.putImageData(id, 0, 0);
  // kenar kararması
  const vg = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.15);
  vg.addColorStop(0, "rgba(90,60,25,0)"); vg.addColorStop(0.6, "rgba(90,60,25,0.10)"); vg.addColorStop(1, "rgba(80,50,20,0.34)");
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return c;
}

// ---------- tüy kalem ----------
function kalemKur() {
  const grp = new P.Group({ applyMatrix: false });
  const vane = new P.Path({ segments: [[70, 0], [110, -14], [170, -27], [215, -31], [222, -25], [270, -33], [330, -20], [352, -4], [356, 0], [320, 9], [262, 14], [255, 9], [200, 16], [130, 10], [80, 3]].map(pt), closed: true });
  vane.smooth({ type: "catmull-rom" }); vane.fillColor = "#f2e9d3"; vane.strokeColor = INK; vane.strokeWidth = 1.3;
  vane.shadowColor = new P.Color(0.17, 0.11, 0.07, 0.35); vane.shadowBlur = 14; vane.shadowOffset = new P.Point(10, 12);
  grp.addChild(vane); kalemGolge = vane;
  for (let i = 0; i < 26; i++) { const x = 95 + i * 10, up = i % 2 === 0; const l = new P.Path({ segments: [pt([x, 0]), pt([x + 16, up ? -18 - 8 * Math.sin(i / 25 * 3) : 12])] });
    l.strokeColor = new P.Color(0.17, 0.11, 0.07, 0.35); l.strokeWidth = 0.8; grp.addChild(l); }
  const sap = new P.Path({ segments: [pt([4, 0]), pt([200, -2]), pt([360, -4])] }); sap.smooth(); sap.strokeColor = INK; sap.strokeWidth = 2.2; grp.addChild(sap);
  const uc = new P.Path({ segments: [[0, 0], [30, -3.5], [46, -3], [46, 3], [30, 3]].map(pt), closed: true }); uc.fillColor = INK; grp.addChild(uc);
  return grp;
}
// kalem hedefi: aktif darbenin ucu; darbeler arasında havadan geçer
function kalemDurum(f) {
  const ana = CIZGILER;
  let akt = null; for (const c of ana) if (f >= c.bas && f < c.bas + c.sure) { if (!akt || c.bas >= akt.bas) akt = c; }
  if (akt) return { p: basUcu(akt, ilerle(akt, f)), kalk: 0, gor: 1 };
  let once = null, sonra = null;
  for (const c of ana) { const e = c.bas + c.sure; if (e <= f && (!once || e > once.bas + once.sure)) once = c; if (c.bas > f && (!sonra || c.bas < sonra.bas)) sonra = c; }
  if (!once && sonra) return { p: sonra.p[0], kalk: 0.3, gor: 1 };
  if (once && sonra) { const e = once.bas + once.sure, u = yumus((f - e) / (sonra.bas - e)); return { p: L2(once.p[once.n - 1], sonra.p[0], u), kalk: Math.sin(Math.PI * u), gor: 1 }; }
  // çıkış: halkadan sonra kalem sağ alttan kadrajı terk eder
  const e = once.bas + once.sure, u = yumus((f - e) / 10);
  return { p: L2(once.p[once.n - 1], [2250, 1450], u), kalk: Math.min(1, u * 3), gor: u < 1 ? 1 : 0 };
}

let kagit;

function olaylar() {
  const ev = new Map();
  const koy = (k, tur, guc) => { k = Math.max(0, Math.min(KARE - 1, Math.round(k))); const a = k + "|" + tur; if (!ev.has(a) || ev.get(a).guc < guc) ev.set(a, { kare: k, tur, guc: +guc.toFixed(2) }); };
  for (const c of CIZGILER) {
    if (c.ses === false) continue;
    if (c.ses === "hisirti") koy(c.bas, "hisirti", c.tur === "yazi" ? 0.3 : 0.45);
    else if (c.ses === "kirmizi") koy(c.bas, "cizgi", 1.0);
    else if (c.tur === "ana" && c.L > 25) koy(c.bas, "cizgi", Math.min(0.85, 0.25 + c.L / 1400));
  }
  return [...ev.values()].sort((a, b) => a.kare - b.kare || a.tur.localeCompare(b.tur));
}

async function kare(f) {
  pilotDolgu.opacity = 0.8 * yumus((f - pilotIlk.bas) / 22);
  for (const c of CIZGILER) {
    const t = ilerle(c, f);
    if (t <= 0) { if (c.yolP) { c.yolP.remove(); c.yolP = null; } continue; }
    if (c.tam && t >= 1) continue;
    if (c.yolP) c.yolP.remove();
    c.yolP = cokgen(c, t); (c.bas < pilotIlk.bas ? altKatman : murekKatman).addChild(c.yolP); c.tam = t >= 1;
  }
  // darbeler yaratılış sırasına göre üst üste gelsin (kırmızı halka en üstte)
  if (halka && halka.yolP) halka.yolP.bringToFront();
  const yk = yumus((f - 140) / 36);
  kanatYikama.opacity = 0.62 * yk; kuyrukYikama.opacity = 0.62 * yumus((f - 150) / 30);
  const k = kalemDurum(f);
  kalem.visible = k.gor > 0;
  const aci = 236 + 5 * gurul(f / 18, 9) + 4 * k.kalk;
  kalem.matrix = new P.Matrix().translate(k.p[0], k.p[1] - 6 * k.kalk).rotate(aci).scale(1 + 0.05 * k.kalk);
  kalemGolge.shadowOffset = new P.Point(8 + 18 * k.kalk, 10 + 16 * k.kalk);
  kalem.bringToFront();
  P.view.update();
  if (f === KARE - 1) await fetch("/log", { method: "POST", body: "OLAYLAR " + JSON.stringify(olaylar()) });
  return document.getElementById("cv");
}
