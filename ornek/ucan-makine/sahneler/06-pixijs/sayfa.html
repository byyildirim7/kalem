<script type="module">

};
// ---- olaylar
const olaylar = [];
for (let k = 0; k < NFLAP; k++) {
  olaylar.push({ kare: k * P + 9, tur: "kanat", guc: +(0.85 - 0.04 * k).toFixed(2) });
  olaylar.push({ kare: k * P + 12, tur: "hisirti", guc: +(0.7 - 0.05 * k).toFixed(2) });

// ---- parcacik havuzu
const DUST = 700, LIGHT = 450;

  for (let i = 0; i < 70; i++) { const x = rnd(i, 21) * W, y = rnd(i, 22) * H; g.fillStyle = `rgba(110,75,35,${0.1 + rnd(i, 23) * 0.15})`; g.beginPath(); g.arc(x, y, 1 + rnd(i, 24) * 2.2, 0, 6.283); g.fill(); }
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.0); v.addColorStop(0, "rgba(70,40,10,0)"); v.addColorStop(1, "rgba(70,40,10,0.42)"); g.fillStyle = v; g.fillRect(0, 0, W, H);

}
let app, dustP = [], lightP = [], gMak, gZem, glowL, glowR, ring, dustC, lightC;
const wob = (i, a = 1) => (rnd(i, 77) - 0.5) * 2 * a;
function cizgi(g, pts, w, col, al = 1) { if (pts.length < 2) return; g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.stroke({ width: w, color: col, alpha: al, cap: "round", join: "round" }); }
async function kur() {
  app = new Application();
  await app.init({ width: W, height: H, background: 0xE8D9B8, antialias: true, preserveDrawingBuffer: true, resolution: 1, autoDensity: false, autoStart: false, sharedTicker: false });

  const z = gZem; const pts = []; for (let x = 0; x <= W; x += 24) pts.push([x, GY + wob(x, 2.2) + Math.sin(x * 0.01) * 1.5]); cizgi(z, pts, 3, INK, 0.9);
  const p2 = []; for (let x = 120; x <= W - 120; x += 30) p2.push([x, GY + 14 + wob(x + 5, 2)]); cizgi(z, p2, 1.5, SOLUK, 0.5);

function makine(f) {
  const g = gMak; g.clear();

  const govde = []; for (let i = 0; i <= 24; i++) { const t = i / 24 * Math.PI; govde.push([HX + Math.cos(t) * 62 + wob(i + 100, 1.2), HY + 40 + Math.sin(t) * 150 + wob(i + 130, 1.2)]); }

    for (let i = 1; i <= N; i++) { const a = ust[i], b = alt[i]; g.moveTo(a[0], a[1]).lineTo(b[0], b[1]); g.stroke({ width: i % 3 === 0 ? 2.4 : 1.2, color: i % 3 === 0 ? INK : SOLUK, alpha: i % 3 === 0 ? 0.9 : 0.55, cap: "round" }); }

    cizgi(g, alt, 2.6, INK, 0.9);
    cizgi(g, ust.map((p, i) => [p[0] + wob(i + (yan > 0 ? 300 : 400), 0.8), p[1] + wob(i + 500, 0.8)]), 5.5, INK);
  }

function parcacik(f) {
  const kapa = (p) => { p.alpha = 0; p.x = -999; p.y = -999; };
  for (let k = 0; k < NFLAP; k++) {
    // toz
    for (let i = 0; i < DUST; i++) {
      const p = dustP[k * DUST + i], id = k * 10007 + i;
      const te = k * P + 8 + rnd(id, 1) * 14, a = f - te, life = 62 + rnd(id, 2) * 38;
      if (a < 0 || a > life) { kapa(p); continue; }
      const yan = rnd(id, 3) < 0.5 ? -1 : 1, mesafe = 90 + Math.pow(rnd(id, 4), 0.8) * 640;
      const x0 = HX + yan * mesafe, y0 = GY + 4 + rnd(id, 5) * 36;
      const d = 0.05 + 0.04 * rnd(id, 6), vx = yan * (0.8 + 4.5 * rnd(id, 7)) * (0.5 + mesafe / 700), vy = -(3.5 + 9 * rnd(id, 8)) * (0.7 + 0.5 * amp(te)), gr = 0.006 + 0.01 * rnd(id, 9);
      const e = (1 - Math.exp(-d * a)) / d;
      p.x = x0 + vx * e + Math.sin(a * 0.08 + rnd(id, 10) * 6) * 6; p.y = Math.min(GY + 30, y0 + vy * e + gr * a * a * 0.5);
      const sz = (50 + 110 * rnd(id, 11)) / 64 * (0.6 + 0.9 * sm(a / 40)); p.scaleX = p.scaleY = sz;

    for (let i = 0; i < LIGHT; i++) {
      const p = lightP[k * LIGHT + i], id = k * 20011 + i + 5;
      const te = k * P + 4 + rnd(id, 1) * 14, a = f - te, life = 36 + rnd(id, 2) * 30;
      if (a < 0 || a > life) { kapa(p); continue; }
      const yan = rnd(id, 3) < 0.5 ? -1 : 1, u = 0.3 + 0.7 * rnd(id, 4), ed = rnd(id, 5) < 0.5 ? 0 : 0.5;
      const [bx, by] = kanatNokta(te, u, yan, ed * Math.sin(Math.PI * Math.min(1, u * 1.1 + 0.04)));

}
