<!doctype html><meta charset=utf-8><script src="node_modules/tone/build/Tone.js"></script>
<script type="module">
// Kareye kilitli efekt sesi. ?o=<olaylar.json yolu>  {fps, kare, olaylar:[{kare, tur, guc}]}
// Her tür bir ses: cizgi kalem hışırtısı, tik/vurus/dusme ahşap darbe, sayac yumuşak tık, kanat hava süpürmesi,
// hisirti toz, parilti yumuşak çan, sayfa kâğıt çevirme. Rastgelelik tohumlu: iki koşu aynı ses.
const tohum = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
window.render = async () => {
  Math.random = tohum(7);
  const O = await (await fetch(new URLSearchParams(location.search).get("o"))).json();
  const FPS = O.fps, SURE = O.kare / FPS + 0.5, t = (f) => f / FPS;
  const buf = await Tone.Offline(() => {
    const master = new Tone.Limiter(-1.5).toDestination();
    const rev = new Tone.Reverb({ decay: 2.2, wet: 1 }); rev.generate(); const revG = new Tone.Gain(0.18).connect(master); rev.connect(revG);
    const bus = new Tone.Gain(1).fan(master, rev);
    // oda tonu: çok alçak, kâğıt odası hissi
    const oda = new Tone.Noise("brown").start(0).stop(SURE); const odaF = new Tone.Filter(220, "lowpass"); const odaG = new Tone.Gain(0.025).connect(master); oda.connect(odaF); odaF.connect(odaG);
    const gurultu = (tip, f, Q, vol, a, d) => { const n = new Tone.NoiseSynth({ noise: { type: tip }, envelope: { attack: a, decay: d, sustain: 0 }, volume: vol }); const fl = new Tone.Filter({ type: "bandpass", frequency: f, Q }).connect(bus); n.connect(fl); return [n, fl]; };
    // kalem: kısa patlamalar değil, darbe boyunca süren yumuşak, alçak bir hışırtı (tiz yok)
    const kalem = new Tone.NoiseSynth({ noise: { type: "brown" }, envelope: { attack: 0.14, decay: 0, sustain: 1, release: 0.35 }, volume: -44 });
    const kalemLP = new Tone.Filter(1000, "lowpass").connect(bus); const kalemBP = new Tone.Filter({ type: "bandpass", frequency: 650, Q: 0.4 }).connect(kalemLP);
    const kalemTit = new Tone.Gain(1).connect(kalemBP); kalem.connect(kalemTit);
    new Tone.LFO({ frequency: 5, min: 0.75, max: 1 }).start(0).connect(kalemTit.gain);   // elin hafif titremesi
    // çizgi olaylarını darbelere topla: 0,25 sn'den yakın olaylar aynı darbe
    const cz = O.olaylar.filter((o) => o.tur === "cizgi").map((o) => t(o.kare)).sort((a, b) => a - b);
    for (let i = 0; i < cz.length;) { let j = i; while (j + 1 < cz.length && cz[j + 1] - cz[j] < 0.25) j++; kalem.triggerAttack(cz[i]); kalem.triggerRelease(Math.max(cz[j] + 0.12, cz[i] + 0.15)); i = j + 1; }
    const [sup, supF] = gurultu("pink", 600, 0.8, -20, 0.08, 0.35);
    const [toz] = gurultu("brown", 900, 0.6, -22, 0.15, 0.9);
    const [sayfa, sayfaF] = gurultu("white", 2500, 0.7, -18, 0.02, 0.45);
    const ahsap = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 3, envelope: { attack: 0.001, decay: 0.12, sustain: 0 }, volume: -12 }).connect(bus);
    const tok = new Tone.MembraneSynth({ pitchDecay: 0.03, octaves: 4, envelope: { attack: 0.001, decay: 0.3, sustain: 0 }, volume: -10 }).connect(bus);
    const tik = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.04, sustain: 0 }, volume: -24 }).connect(bus);
    const can = new Tone.FMSynth({ harmonicity: 3, modulationIndex: 4, envelope: { attack: 0.01, decay: 1.2, sustain: 0 }, volume: -28 }).connect(bus);
    const NOTA = ["E5", "G5", "B5", "D6"];
    let son = {};
    for (const o of O.olaylar) {
      const at = t(o.kare), g = Math.max(0.15, Math.min(1, o.guc ?? 0.6)), r = Math.random();
      if (son[o.tur] !== undefined && at - son[o.tur] < 0.03) continue;   // aynı türden üst üste binen olay tek ses
      son[o.tur] = at;
      switch (o.tur) {
        case "cizgi": break;   // yukarıda darbe olarak çalındı
        case "tik": case "dusme": ahsap.triggerAttackRelease(["G3", "A3", "C4", "D4"][Math.floor(r * 4)], 0.08, at, g); break;
        case "vurus": tok.triggerAttackRelease(["C2", "D2", "E2"][Math.floor(r * 3)], 0.2, at, g); break;
        case "sayac": tik.triggerAttackRelease(["C6", "D6"][Math.floor(r * 2)], 0.03, at, g * 0.7); break;
        case "kanat": supF.frequency.setValueAtTime(400, at); supF.frequency.exponentialRampToValueAtTime(1400, at + 0.3); sup.triggerAttackRelease(0.35, at, g); break;
        case "hisirti": toz.triggerAttackRelease(0.9, at, g); break;
        case "parilti": can.triggerAttackRelease(NOTA[Math.floor(r * 4)], 0.2, at, g * 0.6); break;
        case "sayfa": sayfaF.frequency.setValueAtTime(1500, at); sayfaF.frequency.exponentialRampToValueAtTime(4500, at + 0.35); sayfa.triggerAttackRelease(0.45, at, g); break;
      }
    }
  }, SURE, 2, 44100);
  const enc = (a) => { const u = new Uint8Array(a.buffer); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  return [enc(buf.getChannelData(0)), enc(buf.getChannelData(1))];
};
window.hazir = true;
</script>
